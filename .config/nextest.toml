# cargo-nextest configuration for Negroni

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "binary(dst_cluster_sim)"
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
