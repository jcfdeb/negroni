[workspace]
resolver = "3"
members = [
    "crates/negroni-types",
    "crates/negroni-config",
    "crates/negroni-watchdog",
    "crates/negroni-dcs",
    "crates/negroni-pg",
    "crates/negroni-ha",
    "crates/negroni-api",
    "crates/negroni-cli",
    "bin/negroni",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Zero-panic & unsafe documentation discipline
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

# Structured logging enforcement (overridden only in CLI / entrypoint startup)
print_stdout = "deny"
print_stderr = "deny"

# Curated high-signal pedantic & nursery lints
cloned_instead_of_copied = "deny"
debug_assert_with_mut_call = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
manual_let_else = "deny"
semicolon_if_nothing_returned = "deny"
unnested_or_patterns = "deny"

[workspace.dependencies]
# Internal workspace crates
negroni-api = { path = "crates/negroni-api" }
negroni-cli = { path = "crates/negroni-cli" }
negroni-config = { path = "crates/negroni-config" }
negroni-dcs = { path = "crates/negroni-dcs" }
negroni-ha = { path = "crates/negroni-ha" }
negroni-pg = { path = "crates/negroni-pg" }
negroni-types = { path = "crates/negroni-types" }
negroni-watchdog = { path = "crates/negroni-watchdog" }

# Pure-Rust external dependencies (zero C/OpenSSL toolchain required)
anyhow = "1.0"
arc-swap = "1.9"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
compact_str = { version = "0.10", features = ["serde"] }
futures-util = "0.3"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
ipnet = "2.10"
jiff = { version = "0.2", features = ["serde"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube-core = "0.99"
proptest = "1.6"
prost = { version = "0.13", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rustix = { version = "1.1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"
saphyr = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "2.7"
smallvec = "1.16"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
tokio-postgres = { version = "0.7", features = ["runtime"] }
tokio-postgres-rustls = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync", "net"] }
tonic = { version = "0.13", default-features = false, features = ["channel", "prost", "tls-ring", "tls-native-roots"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
