[workspace]
resolver = "3"
members = [
    "crates/negroni-types",
    "crates/negroni-config",
    "crates/negroni-watchdog",
    "crates/negroni-dcs",
    "crates/negroni-pg",
    "crates/negroni-ha",
    "crates/negroni-api",
    "crates/negroni-cli",
    "bin/negroni",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Zero-panic & unsafe documentation discipline
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

# Structured logging enforcement (overridden only in CLI / entrypoint startup)
print_stdout = "deny"
print_stderr = "deny"

# Curated high-signal pedantic & nursery lints
cloned_instead_of_copied = "deny"
debug_assert_with_mut_call = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
manual_let_else = "deny"
semicolon_if_nothing_returned = "deny"
unnested_or_patterns = "deny"

[workspace.dependencies]
# Internal workspace crates
negroni-api = { path = "crates/negroni-api" }
negroni-cli = { path = "crates/negroni-cli" }
negroni-config = { path = "crates/negroni-config" }
negroni-dcs = { path = "crates/negroni-dcs" }
negroni-ha = { path = "crates/negroni-ha" }
negroni-pg = { path = "crates/negroni-pg" }
negroni-types = { path = "crates/negroni-types" }
negroni-watchdog = { path = "crates/negroni-watchdog" }

# Pure-Rust external dependencies (zero C/OpenSSL toolchain required)
anyhow = "1.0"
arc-swap = "1.9"
clap = { version = "4.5", features = ["derive", "env"] }
compact_str = { version = "0.10", features = ["serde"] }
proptest = "1.6"
rustix = { version = "1.1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"
saphyr = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.16"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "fs", "io-util"] }
tokio-postgres = { version = "0.7", features = ["runtime"] }
tokio-postgres-rustls = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
